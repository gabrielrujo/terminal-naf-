{% extends "base.html" %}
{% block content %}

<p class="home-hero">Atendimento registrado. Guarde ou anote seu número de protocolo — ele também confirma sua senha no painel de chamadas.</p>

<div class="carimbo-wrap">
  <div class="carimbo">
    <span class="selo-label">Protocolo NAF</span>
    <span class="protocolo">{{ atendimento['protocolo'] }}</span>
    <span class="servico-nome">{{ atendimento['servico_nome'] }}</span>
  </div>
</div>

<div class="actions-row">
  <a class="btn btn-primary" href="{{ url_for('avaliacao', protocolo=atendimento['protocolo']) }}">Avaliar atendimento</a>
  <a class="btn btn-ghost" href="{{ url_for('index') }}">Voltar ao início</a>
</div>

{% endblock %}
